<body>
  <div class="top">
    <div class="toolbar"><button class="btn" id="backBtn">← <span data-t="back">돌아가기</span></button><button class="btn" id="pauseBtn" data-t="pause">일시정지</button><button class="btn primary" id="retryBtn" data-t="retry">재도전</button><button class="btn" id="rankBtn">🏆 <span data-t="rankings">랭킹</span></button><select class="select" id="langSelect" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">中文</option></select></div>
    <div class="stats"><div class="stat"><small data-t="distance">비행 거리</small><strong id="distance">0 m</strong></div><div class="stat"><small data-t="best">최고 기록</small><strong id="best">0 m</strong></div></div>
  </div>
  <canvas id="game" aria-label="Car launch game"></canvas>
  <div class="altitude" id="altitude" aria-live="polite">↑ 0 m</div>
  <aside class="item-queue" aria-live="polite"><strong class="item-queue-title" data-t="itemOrder">ITEM ORDER →</strong><div class="item-slots" id="itemQueue"></div></aside>
  <div class="launch-ui" id="launchUi"><div class="instruction" id="instruction" data-t="angleHelp">버튼을 누른 채 게이지를 채우고 원하는 방향에서 떼세요</div><div class="meter"><div class="meter-fill" id="meterFill"></div><i class="meter-mark"></i><i class="meter-mark"></i></div><button class="hold" id="holdBtn" data-t="angleButton">누르고 조준·충전하기</button></div>

    function drawSpeedLines(){if(phase!=='flight'||car.vx<700)return;ctx.save();let intensity=Math.min(1,car.vx/9000);ctx.globalAlpha=.12+.18*intensity;ctx.fillStyle='#fff';for(let i=0;i<9;i++){let y=55+seedRandom(i+810)*(H-150),len=20+seedRandom(i+850)*95,x=((seedRandom(i+890)*W-time*(180+seedRandom(i)*420))%(W+180)+W+180)%(W+180);ctx.beginPath();ctx.ellipse(x,y,len,1.2+seedRandom(i+910)*1.8,0,0,Math.PI*2);ctx.fill()}ctx.restore()}
    const BACKGROUND_SCENES=[
      {name:'mountains',sky:['#72d8ff','#eafaff']},{name:'city',sky:['#76d4f5','#d9f4ff']},{name:'desert',sky:['#77d9ff','#fff0bf']},
      {name:'coast',sky:['#66d5ff','#dffaff']},{name:'country',sky:['#88dcff','#ecfbdf']},{name:'snow',sky:['#8bcff5','#f4fbff']}
    ];
    function backgroundState(){let total=distanceMeters(),length=9000,raw=Math.floor(total/length),local=total-raw*length,t=Math.max(0,Math.min(1,(local-8000)/1000));t=t*t*(3-2*t);return{current:raw%BACKGROUND_SCENES.length,next:(raw+1)%BACKGROUND_SCENES.length,blend:t}}
    function scrollObjects(spacing,speed,pad,draw){let shifted=camera*speed,first=Math.floor((shifted-pad)/spacing),last=Math.ceil((shifted+W+pad)/spacing);for(let i=first;i<=last;i++)draw(i*spacing-shifted,i)}
    function fillSceneSky(scene,alpha){ctx.save();ctx.globalAlpha=alpha;let g=ctx.createLinearGradient(0,0,0,roadTop());g.addColorStop(0,scene.sky[0]);g.addColorStop(1,scene.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,roadTop());ctx.restore()}
    function drawClouds(){ctx.save();ctx.fillStyle='rgba(255,255,255,.74)';scrollObjects(370,.055,150,(x,i)=>{let y=72+(Math.abs(i)%3)*65,s=18+seedRandom(i+930)*22;ctx.beginPath();ctx.arc(x,y,s,0,7);ctx.arc(x+s,y-9,s*1.22,0,7);ctx.arc(x+s*2.05,y,s*.82,0,7);ctx.fill()});ctx.restore()}
    function drawMountains(){let layers=[{c:'#91d4a5',s:.07,y:roadTop()-92},{c:'#45bd84',s:.15,y:roadTop()-34}];layers.forEach((layer,j)=>{ctx.fillStyle=layer.c;ctx.beginPath();ctx.moveTo(-120,roadTop());for(let x=-120;x<W+180;x+=130){let world=Math.floor((x+camera*layer.s)/130),height=62+seedRandom(world+j*91)*98;ctx.lineTo(x,layer.y-height);ctx.quadraticCurveTo(x+65,layer.y-height-28,x+130,layer.y)}ctx.lineTo(W+180,roadTop());ctx.closePath();ctx.fill()})}
    function drawCity(){ctx.fillStyle='#acd2df';ctx.fillRect(0,roadTop()-42,W,42);scrollObjects(94,.09,120,(x,i)=>{let h=76+seedRandom(i+1200)*132,w=68+seedRandom(i+1230)*26,y=roadTop()-h;ctx.fillStyle=i%3===0?'#667b96':i%3===1?'#8297ad':'#536b87';ctx.fillRect(x,y,w,h);ctx.fillStyle='rgba(255,230,124,.72)';for(let wy=y+15;wy<roadTop()-12;wy+=22)for(let wx=x+12;wx<x+w-9;wx+=19)if(seedRandom(i*97+wx+wy)>.28)ctx.fillRect(wx,wy,7,9)});scrollObjects(250,.17,160,(x,i)=>{ctx.fillStyle='#31445e';let h=82+seedRandom(i+1280)*54;ctx.fillRect(x,roadTop()-h,16,h);ctx.fillStyle='#eef8ff';ctx.beginPath();ctx.arc(x+8,roadTop()-h-8,11,0,7);ctx.fill()})}
    function drawDesert(){ctx.fillStyle='#e8bd69';ctx.beginPath();ctx.moveTo(0,roadTop());for(let x=-100;x<W+140;x+=120){let y=roadTop()-42-seedRandom(Math.floor((x+camera*.08)/120)+1400)*48;ctx.quadraticCurveTo(x+60,y-25,x+120,y)}ctx.lineTo(W+140,roadTop());ctx.closePath();ctx.fill();ctx.fillStyle='#d9954e';scrollObjects(310,.15,180,(x,i)=>{let h=48+seedRandom(i+1450)*58,w=74+seedRandom(i+1460)*55;ctx.fillRect(x,roadTop()-h,w,h);ctx.fillStyle='#f0b965';ctx.fillRect(x+15,roadTop()-h-16,w-30,18)});ctx.strokeStyle='#b47738';ctx.lineWidth=6;scrollObjects(230,.22,80,(x,i)=>{let y=roadTop()-22,h=24+seedRandom(i+1500)*28;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-h);ctx.moveTo(x,y-h*.55);ctx.lineTo(x-11,y-h*.75);ctx.moveTo(x,y-h*.38);ctx.lineTo(x+10,y-h*.6);ctx.stroke()})}
    function drawCoast(){ctx.fillStyle='#2db6d8';ctx.fillRect(0,roadTop()-124,W,124);ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=3;for(let row=0;row<3;row++)scrollObjects(120,.08+row*.035,40,(x,i)=>{ctx.beginPath();ctx.arc(x,roadTop()-102+row*32,28,Math.PI*1.08,Math.PI*1.92);ctx.stroke()});ctx.fillStyle='#4a9b78';scrollObjects(330,.1,180,(x,i)=>{let w=115+seedRandom(i+1600)*90,h=25+seedRandom(i+1610)*34;ctx.beginPath();ctx.ellipse(x,roadTop()-112,w,h,0,0,7);ctx.fill()});scrollObjects(260,.18,100,(x,i)=>{let y=roadTop()-82,s=18+seedRandom(i+1640)*12;ctx.strokeStyle='#765239';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+5,y-55);ctx.stroke();ctx.fillStyle='#38a96d';for(let a=-2;a<=2;a++){ctx.beginPath();ctx.ellipse(x+5+a*6,y-58,7,s,a*.5,0,7);ctx.fill()}})}
    function drawCountry(){ctx.fillStyle='#9fd879';ctx.beginPath();ctx.moveTo(0,roadTop());for(let x=-100;x<W+160;x+=160){let y=roadTop()-58-seedRandom(Math.floor((x+camera*.07)/160)+1700)*46;ctx.quadraticCurveTo(x+80,y-34,x+160,y)}ctx.lineTo(W+160,roadTop());ctx.closePath();ctx.fill();ctx.fillStyle='#55ad67';ctx.fillRect(0,roadTop()-44,W,44);scrollObjects(330,.16,150,(x,i)=>{let y=roadTop()-42;ctx.fillStyle=i%2?'#f4e4b8':'#f1b56f';ctx.fillRect(x,y-43,74,43);ctx.fillStyle='#b84e45';ctx.beginPath();ctx.moveTo(x-7,y-43);ctx.lineTo(x+37,y-76);ctx.lineTo(x+81,y-43);ctx.fill();ctx.fillStyle='#5b7451';ctx.fillRect(x+30,y-24,15,24)});scrollObjects(430,.09,100,(x,i)=>{let y=roadTop()-92;ctx.strokeStyle='#f8f5e8';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-77);ctx.stroke();for(let a=0;a<3;a++){ctx.save();ctx.translate(x,y-77);ctx.rotate(a*Math.PI*2/3+seedRandom(i)*.4);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-34);ctx.stroke();ctx.restore()}})}
    function drawSnow(){ctx.fillStyle='#b9d8e8';ctx.beginPath();ctx.moveTo(-100,roadTop());for(let x=-100;x<W+180;x+=145){let world=Math.floor((x+camera*.07)/145),h=86+seedRandom(world+1800)*100;ctx.lineTo(x+72,roadTop()-h);ctx.lineTo(x+145,roadTop())}ctx.closePath();ctx.fill();ctx.fillStyle='#f7fcff';ctx.beginPath();ctx.moveTo(-100,roadTop());for(let x=-100;x<W+180;x+=145){let world=Math.floor((x+camera*.07)/145),h=86+seedRandom(world+1800)*100;ctx.lineTo(x+72,roadTop()-h);ctx.lineTo(x+92,roadTop()-h*.72);ctx.lineTo(x+108,roadTop()-h*.79);ctx.lineTo(x+145,roadTop())}ctx.closePath();ctx.fill();ctx.fillStyle='#3d7b6d';scrollObjects(105,.19,80,(x,i)=>{let y=roadTop(),h=45+seedRandom(i+1850)*58;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+22,y-h);ctx.lineTo(x+44,y);ctx.fill();ctx.beginPath();ctx.moveTo(x+6,y-20);ctx.lineTo(x+22,y-h-23);ctx.lineTo(x+38,y-20);ctx.fill()})}
    const SCENE_DRAWERS=[drawMountains,drawCity,drawDesert,drawCoast,drawCountry,drawSnow];
    function drawBiome(index,alpha){ctx.save();ctx.globalAlpha=alpha;SCENE_DRAWERS[index]();ctx.restore()}
    function drawSky(){let state=backgroundState(),current=BACKGROUND_SCENES[state.current],next=BACKGROUND_SCENES[state.next];fillSceneSky(current,1);if(state.blend)fillSceneSky(next,state.blend);drawClouds();drawBiome(state.current,1-state.blend);if(state.blend)drawBiome(state.next,state.blend);canvas.dataset.background=state.blend?`${current.name}-${next.name}`:current.name;ctx.fillStyle='#e9c98d';ctx.fillRect(0,roadTop(),W,H-roadTop());ctx.fillStyle='#26364f';ctx.fillRect(0,roadTop(),W,9);ctx.strokeStyle='#fffdf0';ctx.lineWidth=7;ctx.setLineDash([45,35]);ctx.lineDashOffset=-(camera%80);ctx.beginPath();ctx.moveTo(0,ground());ctx.lineTo(W,ground());ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=.18;ctx.fillStyle='#8a6b45';for(let i=0;i<16;i++){let x=((i*149-camera*.7)%(W+80)+W+80)%(W+80)-40;ctx.fillRect(x,ground()+25+(i%3)*13,28+(i%4)*18,3)}ctx.globalAlpha=1}
    function drawObstacle(o){if(o.used)return;let x=worldToScreen(o.x);if(x<-180||x>W+180)return;ctx.save();ctx.translate(x,ground()-o.h*.48);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='76px "Segoe UI Emoji","Apple Color Emoji",sans-serif';ctx.shadowColor='rgba(20,33,61,.35)';ctx.shadowBlur=4;ctx.shadowOffsetY=3;ctx.fillText(itemIcon(o),0,0);ctx.restore()}
    function drawCar(x,y,rot,scale=1){ctx.save();ctx.translate(x,y+CAR_ROAD_OFFSET);ctx.rotate(rot);ctx.scale(scale*(carSprite.flip?-1:1),scale);if(carSprite.canvas||carImg.complete&&carImg.naturalWidth){let image=carSprite.canvas||carImg,iw=image.naturalWidth||image.width,ih=image.naturalHeight||image.height,sx=0,sy=0,sw=iw,sh=ih;if(!carSprite.canvas){sx=iw*.02;sy=ih*.08;sw=iw*.96;sh=ih*.72}let ratio=Math.min(car.w/sw,car.h/sh),dw=sw*ratio,dh=sh*ratio;ctx.filter='drop-shadow(2px 0 #14213d) drop-shadow(-2px 0 #14213d) drop-shadow(0 2px #14213d) drop-shadow(0 -2px #14213d) saturate(1.15) contrast(1.05)';ctx.drawImage(image,sx,sy,sw,sh,-dw/2,car.h/2-dh,dw,dh)}else{let bw=car.w*profile[2],bh=car.h*profile[3];ctx.fillStyle=carColor;ctx.strokeStyle='#14213d';ctx.lineWidth=4;rounded(-bw/2,car.h/2-bh,bw,bh,Math.min(15,bh*.28));ctx.fill();ctx.stroke()}ctx.restore()}
    function drawTruck(){let x=truckX,y=ground()-54;ctx.save();ctx.translate(x,y);ctx.fillStyle='#ffcf33';ctx.strokeStyle='#14213d';ctx.lineWidth=4;rounded(-110,-45,150,70,8);ctx.fill();ctx.stroke();ctx.fillStyle='#ff6b35';rounded(30,-34,85,59,8);ctx.fill();ctx.stroke();ctx.fillStyle='#8fe2ff';ctx.fillRect(50,-24,40,24);ctx.strokeRect(50,-24,40,24);ctx.fillStyle='#14213d';[ -70,65].forEach(v=>{ctx.beginPath();ctx.arc(v,25,18,0,7);ctx.fill()});ctx.fillStyle='#14213d';ctx.font='1000 17px sans-serif';ctx.fillText('LAUNCH!',-95,-5);ctx.restore()}
    function drawOffscreenCar(){
      let radius=carVerticalRadius(car.rot),altitude=Math.max(0,(ground()-radius-car.y)*.11);
      if(phase!=='flight'||car.y+radius+CAR_ROAD_OFFSET>=72)return;
      let x=Math.max(92,Math.min(W-92,worldToScreen(car.x))),indicatorY=document.documentElement.classList.contains('mobile-landscape')?96:124;
      ctx.save();ctx.translate(x,indicatorY);ctx.fillStyle='#ff3038';ctx.strokeStyle='#14213d';ctx.lineWidth=5;ctx.lineJoin='miter';ctx.beginPath();ctx.moveTo(0,-42);ctx.lineTo(36,0);ctx.lineTo(16,0);ctx.lineTo(16,34);ctx.lineTo(-16,34);ctx.lineTo(-16,0);ctx.lineTo(-36,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
      drawCar(x,indicatorY+29,0,.22);
      ctx.save();ctx.shadowColor='#14213d';ctx.shadowOffsetY=5;ctx.fillStyle='rgba(255,253,245,.96)';ctx.strokeStyle='#14213d';ctx.lineWidth=3;rounded(x-82,indicatorY+73,164,42,21);ctx.fill();ctx.shadowColor='transparent';ctx.stroke();ctx.fillStyle='#14213d';ctx.font='1000 19px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(fmt(altitude),x,indicatorY+94);ctx.restore();
    }
    function render(){ctx.clearRect(0,0,W,H);drawSky();drawSpeedLines();obstacles.forEach(drawObstacle);particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(worldToScreen(p.x),worldY(p.y),p.size,p.size)});ctx.globalAlpha=1;if(phase==='angle'||phase==='power'||phase==='truck'){let anchorX=launchScreenX();drawCar(anchorX,ground()-car.h/2,0);drawTruck();if(phase==='angle'||phase==='power'){let arrowLength=Math.min(190,W*.38);ctx.save();ctx.translate(anchorX,ground()-car.h/2+CAR_ROAD_OFFSET);ctx.rotate(-angle);ctx.strokeStyle='#ff4d4d';ctx.fillStyle='#ff4d4d';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(arrowLength-12,0);ctx.stroke();ctx.beginPath();ctx.moveTo(arrowLength,0);ctx.lineTo(arrowLength-42,-22);ctx.lineTo(arrowLength-42,22);ctx.closePath();ctx.fill();ctx.restore()}}else if(worldY(car.y)+carVerticalRadius(car.rot)+CAR_ROAD_OFFSET>=72)drawCar(worldToScreen(car.x),worldY(car.y),car.rot);drawOffscreenCar();if(hitFlash>0){ctx.fillStyle=`rgba(255,255,255,${hitFlash*.7})`;ctx.fillRect(0,0,W,H);hitFlash*=.82}}
    function loop(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;if(!paused&&!orientationBlocked){physics(dt);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;p.life-=dt});particles=particles.filter(p=>p.life>0)}render();raf=requestAnimationFrame(loop)}
    function togglePause(force){if(phase==='result'||phase==='angle'||phase==='power')return;paused=force===undefined?!paused:force;$('#pauseOverlay').classList.toggle('hidden',!paused)}
    function downloadShareImage(file){let link=document.createElement('a'),url=URL.createObjectURL(file);link.href=url;link.download=file.name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
    async function share(){let d=$('#shareBtn').dataset.distance,text=tx('shareText').replace('{car}',carData.name).replace('{d}',d)+' '+location.href,file=shareImageFile;try{if(file&&navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({title:'Car Studio · Sky Launch',text,files:[file]});return}if(!file){toast('shareFailed');return}downloadShareImage(file);try{await navigator.clipboard.writeText(text)}catch(_){}toast('shareDownloaded')}catch(e){if(e&&e.name!=='AbortError'){downloadShareImage(file);toast('shareDownloaded')}}}
    $('#holdBtn').addEventListener('pointerdown',startHold);window.addEventListener('pointerup',endHold);window.addEventListener('pointercancel',cancelHold);$('#landscapeBtn').onclick=requestLandscape;$('#retryBtn').onclick=reset;$('#againBtn').onclick=reset;$('#pauseBtn').onclick=()=>togglePause();$('#resumeBtn').onclick=()=>togglePause(false);$('#backBtn').onclick=()=>{if(history.length>1)history.back();else location.href='index.html'};$('#shareBtn').onclick=share;$('#rankBtn').onclick=openRankings;$('#resultRankBtn').onclick=openRankings;$('#monthlyRankTab').onclick=()=>{rankingView='monthly';renderLeaderboard()};$('#hallRankTab').onclick=()=>{rankingView='hall';renderLeaderboard()};$('#rankingCloseBtn').onclick=closeRankings;$('#rankingOverlay').addEventListener('click',e=>{if(e.target===$('#rankingOverlay'))closeRankings()});$('#langSelect').onchange=e=>{lang=e.target.value;localStorage.setItem('carstudioGameLang',lang);applyLang();renderLeaderboard()};window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(e.repeat)return;startHold(e)}if(e.key==='Escape'){if(!$('#rankingOverlay').classList.contains('hidden'))closeRankings();else togglePause()}});window.addEventListener('keyup',e=>{if(e.code==='Space')endHold(e)});window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,80));document.addEventListener('fullscreenchange',updateOrientationGuard);if(screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener('change',resize);resize();applyLang();$('#best').textContent=fmt(best);reset();
  })();
