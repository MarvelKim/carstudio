    function drawSnow(){ctx.fillStyle='#b9d8e8';ctx.beginPath();ctx.moveTo(-100,roadTop());for(let x=-100;x<W+180;x+=145){let world=Math.floor((x+camera*.07)/145),h=86+seedRandom(world+1800)*100;ctx.lineTo(x+72,roadTop()-h);ctx.lineTo(x+145,roadTop())}ctx.closePath();ctx.fill();ctx.fillStyle='#f7fcff';ctx.beginPath();ctx.moveTo(-100,roadTop());for(let x=-100;x<W+180;x+=145){let world=Math.floor((x+camera*.07)/145),h=86+seedRandom(world+1800)*100;ctx.lineTo(x+72,roadTop()-h);ctx.lineTo(x+92,roadTop()-h*.72);ctx.lineTo(x+108,roadTop()-h*.79);ctx.lineTo(x+145,roadTop())}ctx.closePath();ctx.fill();ctx.fillStyle='#3d7b6d';scrollObjects(105,.19,80,(x,i)=>{let y=roadTop(),h=45+seedRandom(i+1850)*58;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+22,y-h);ctx.lineTo(x+44,y);ctx.fill();ctx.beginPath();ctx.moveTo(x+6,y-20);ctx.lineTo(x+22,y-h-23);ctx.lineTo(x+38,y-20);ctx.fill()})}
    const SCENE_DRAWERS=[drawMountains,drawCity,drawDesert,drawCoast,drawCountry,drawSnow];
    function drawBiome(index,alpha){ctx.save();ctx.globalAlpha=alpha;SCENE_DRAWERS[index]();ctx.restore()}
    function drawSky(){let state=backgroundState(),current=BACKGROUND_SCENES[state.current],next=BACKGROUND_SCENES[state.next];fillSceneSky(current,1);if(state.blend)fillSceneSky(next,state.blend);drawClouds();drawBiome(state.current,1-state.blend);if(state.blend)drawBiome(state.next,state.blend);canvas.dataset.background=state.blend?`${current.name}-${next.name}`:current.name;ctx.fillStyle='#e9c98d';ctx.fillRect(0,roadTop(),W,H-roadTop());ctx.fillStyle='#26364f';ctx.fillRect(0,roadTop(),W,9);ctx.strokeStyle='#fffdf0';ctx.lineWidth=7;ctx.setLineDash([45,35]);ctx.lineDashOffset=-(camera%80);ctx.beginPath();ctx.moveTo(0,ground());ctx.lineTo(W,ground());ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=.18;ctx.fillStyle='#8a6b45';for(let i=0;i<16;i++){let x=((i*149-camera*.7)%(W+80)+W+80)%(W+80)-40;ctx.fillRect(x,ground()+25+(i%3)*13,28+(i%4)*18,3)}ctx.globalAlpha=1}
    function drawObstacle(o){if(o.used)return;let x=worldToScreen(o.x);if(x<-180||x>W+180)return;ctx.save();ctx.translate(x,ground()-o.h*.48);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='76px "Segoe UI Emoji","Apple Color Emoji",sans-serif';ctx.shadowColor='rgba(20,33,61,.35)';ctx.shadowBlur=4;ctx.shadowOffsetY=3;ctx.fillText(itemIcon(o),0,0);ctx.restore()}
    function drawCar(x,y,rot,scale=1){ctx.save();ctx.translate(x,y+CAR_ROAD_OFFSET);ctx.rotate(rot);ctx.scale(scale*(carSprite.flip?-1:1),scale);if(carSprite.canvas||carImg.complete&&carImg.naturalWidth){let image=carSprite.canvas||carImg,iw=image.naturalWidth||image.width,ih=image.naturalHeight||image.height,sx=0,sy=0,sw=iw,sh=ih;if(!carSprite.canvas){sx=iw*.02;sy=ih*.08;sw=iw*.96;sh=ih*.72}let ratio=Math.min(car.w/sw,car.h/sh),dw=sw*ratio,dh=sh*ratio;ctx.filter='drop-shadow(2px 0 #14213d) drop-shadow(-2px 0 #14213d) drop-shadow(0 2px #14213d) drop-shadow(0 -2px #14213d) saturate(1.15) contrast(1.05)';ctx.drawImage(image,sx,sy,sw,sh,-dw/2,car.h/2-dh,dw,dh)}else{let bw=car.w*profile[2],bh=car.h*profile[3];ctx.fillStyle=carColor;ctx.strokeStyle='#14213d';ctx.lineWidth=4;rounded(-bw/2,car.h/2-bh,bw,bh,Math.min(15,bh*.28));ctx.fill();ctx.stroke()}ctx.restore()}
    function drawTruck(){let x=truckX,y=ground()-54;ctx.save();ctx.translate(x,y);ctx.fillStyle='#ffcf33';ctx.strokeStyle='#14213d';ctx.lineWidth=4;rounded(-110,-45,150,70,8);ctx.fill();ctx.stroke();ctx.fillStyle='#ff6b35';rounded(30,-34,85,59,8);ctx.fill();ctx.stroke();ctx.fillStyle='#8fe2ff';ctx.fillRect(50,-24,40,24);ctx.strokeRect(50,-24,40,24);ctx.fillStyle='#14213d';[ -70,65].forEach(v=>{ctx.beginPath();ctx.arc(v,25,18,0,7);ctx.fill()});ctx.fillStyle='#14213d';ctx.font='1000 17px sans-serif';ctx.fillText('LAUNCH!',-95,-5);ctx.restore()}
    function drawOffscreenCar(){let radius=carVerticalRadius(car.rot),altitude=Math.max(0,(ground()-radius-car.y)*.11);if(phase!=='flight'||car.y+radius+CAR_ROAD_OFFSET>=72)return;let x=Math.max(70,Math.min(W-70,worldToScreen(car.x)));ctx.save();ctx.translate(x,72);ctx.fillStyle='#ff3038';ctx.strokeStyle='#14213d';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,-42);ctx.lineTo(34,-4);ctx.lineTo(15,-4);ctx.lineTo(15,28);ctx.lineTo(-15,28);ctx.lineTo(-15,-4);ctx.lineTo(-34,-4);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#14213d';ctx.font='1000 21px sans-serif';ctx.textAlign='center';ctx.fillText(fmt(altitude),0,55);ctx.restore()}
    function render(){ctx.clearRect(0,0,W,H);drawSky();drawSpeedLines();obstacles.forEach(drawObstacle);particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(worldToScreen(p.x),worldY(p.y),p.size,p.size)});ctx.globalAlpha=1;if(phase==='angle'||phase==='power'||phase==='truck'){let anchorX=launchScreenX();drawCar(anchorX,ground()-car.h/2,0);drawTruck();if(phase==='angle'||phase==='power'){let arrowLength=Math.min(190,W*.38);ctx.save();ctx.translate(anchorX,ground()-car.h/2+CAR_ROAD_OFFSET);ctx.rotate(-angle);ctx.strokeStyle='#ff4d4d';ctx.fillStyle='#ff4d4d';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(arrowLength-12,0);ctx.stroke();ctx.beginPath();ctx.moveTo(arrowLength,0);ctx.lineTo(arrowLength-42,-22);ctx.lineTo(arrowLength-42,22);ctx.closePath();ctx.fill();ctx.restore()}}else if(worldY(car.y)+carVerticalRadius(car.rot)+CAR_ROAD_OFFSET>=72)drawCar(worldToScreen(car.x),worldY(car.y),car.rot);drawOffscreenCar();if(hitFlash>0){ctx.fillStyle=`rgba(255,255,255,${hitFlash*.7})`;ctx.fillRect(0,0,W,H);hitFlash*=.82}}
    function loop(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;if(!paused){physics(dt);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;p.life-=dt});particles=particles.filter(p=>p.life>0)}render();raf=requestAnimationFrame(loop)}
    function togglePause(force){if(phase==='result'||phase==='angle'||phase==='power')return;paused=force===undefined?!paused:force;$('#pauseOverlay').classList.toggle('hidden',!paused)}
    async function share(){let d=$('#shareBtn').dataset.distance,text=tx('shareText').replace('{car}',carData.name).replace('{d}',d);try{if(navigator.share)await navigator.share({title:'Car Studio · Sky Launch',text,url:location.href});else{await navigator.clipboard.writeText(text+' '+location.href);toast('copied')}}catch(e){}}
    $('#holdBtn').addEventListener('pointerdown',startHold);window.addEventListener('pointerup',endHold);window.addEventListener('pointercancel',cancelHold);$('#retryBtn').onclick=reset;$('#againBtn').onclick=reset;$('#pauseBtn').onclick=()=>togglePause();$('#resumeBtn').onclick=()=>togglePause(false);$('#backBtn').onclick=()=>{if(history.length>1)history.back();else location.href='index.html'};$('#shareBtn').onclick=share;$('#langSelect').onchange=e=>{lang=e.target.value;localStorage.setItem('carstudioGameLang',lang);applyLang()};window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(e.repeat)return;startHold(e)}if(e.key==='Escape')togglePause()});window.addEventListener('keyup',e=>{if(e.code==='Space')endHold(e)});window.addEventListener('resize',resize);resize();applyLang();$('#best').textContent=fmt(best);reset();
  })();
  </script>
