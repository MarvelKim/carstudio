<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Car Studio 멀리날리기 월간 TOP 10 랭킹">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Car Studio">
  <meta property="og:title" content="Car Studio 월간 TOP 10">
  <meta property="og:description" content="매월 1일부터 월말까지 집계한 멀리날리기 TOP 10 기록입니다.">
  <title>Car Studio 월간 TOP 10</title>
  <style>
    :root{--ink:#14213d;--paper:#fffdf5;--yellow:#ffd23f;--red:#ff4d4d;--blue:#2f80ed;--muted:#637083}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:linear-gradient(150deg,#8de3ff,#e8fbff 48%,#fff4cf);color:var(--ink);font-family:Inter,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}.card{width:min(720px,100%);margin:auto;padding:28px;border:4px solid var(--ink);border-radius:24px;background:var(--paper);box-shadow:9px 9px 0 var(--ink)}.badge{display:table;margin:auto;padding:7px 16px;border:2px solid var(--ink);border-radius:999px;background:var(--yellow);font-weight:1000}h1{margin:15px 0 5px;text-align:center;font-size:clamp(34px,8vw,62px);line-height:1}.period{margin:0 0 20px;color:var(--muted);font-weight:900;text-align:center}.state{padding:24px;color:var(--muted);font-weight:900;text-align:center}.ranking{display:grid;gap:8px;margin:0;padding:0;list-style:none}.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:52px;padding:8px 13px;border:2px solid #d8dde5;border-radius:12px;background:#fff;font-size:17px;font-weight:900}.position{display:grid;place-items:center;width:31px;height:31px;border-radius:50%;background:#edf0f5;font-size:16px}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score{color:var(--red);white-space:nowrap}.crown{--main:#ffd23f;--dark:#e6a800;--light:#fff1a6;display:grid;place-items:center;width:34px;height:34px}.crown.silver{--main:#d9e0e9;--dark:#8b98a9;--light:#fff}.crown.bronze{--main:#cd7f45;--dark:#8f4d2d;--light:#f1bc8e}.crown svg{width:32px;height:28px;filter:drop-shadow(0 1px 0 rgba(20,33,61,.3));overflow:visible}.crown-main{fill:var(--main)}.crown-dark{fill:var(--dark)}.crown-light{fill:var(--light)}.outline{stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.button{display:grid;place-items:center;min-height:48px;padding:9px 14px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);font-family:inherit;font-size:15px;font-weight:900;text-align:center;text-decoration:none;box-shadow:3px 3px 0 var(--ink);cursor:pointer}.button.primary{background:var(--yellow)}.notice{margin:18px 0 0;color:var(--muted);font-size:12px;font-weight:800;line-height:1.55;text-align:center}@media(max-width:560px){body{padding:12px}.card{padding:20px 14px}.row{grid-template-columns:35px minmax(0,1fr) auto;padding:7px 9px;font-size:14px}.actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">전체 사용자 랭킹</span>
    <h1 id="title">월간 TOP 10</h1>
    <p class="period" id="period"></p>
    <p class="state" id="state">랭킹을 불러오는 중...</p>
    <ol class="ranking" id="ranking" hidden></ol>
    <div class="actions">
      <button class="button primary" id="naverShare" type="button">네이버 블로그에 공유</button>
      <button class="button" id="copyReport" type="button">랭킹 내용 복사</button>
      <a class="button" href="game.html">미니게임 하러 가기</a>
    </div>
    <p class="notice">개인정보 보호를 위해 다른 사용자의 이름은 일부 가려서 표시합니다. 네이버 공식 자동 글쓰기 API 종료로 카테고리 선택과 최종 게시는 네이버 화면에서 확인해 주세요.</p>
  </main>
  <script>
    (()=>{
      const $=selector=>document.querySelector(selector);
      const validPeriod=value=>/^\d{4}-(0[1-9]|1[0-2])$/.test(value||'');
      const previousPeriod=()=>{let now=new Date(),kst=new Date(now.getTime()+9*60*60*1000),date=new Date(Date.UTC(kst.getUTCFullYear(),kst.getUTCMonth()-1,1));return `${date.getUTCFullYear()}-${String(date.getUTCMonth()+1).padStart(2,'0')}`};
      const period=validPeriod(new URLSearchParams(location.search).get('period'))?new URLSearchParams(location.search).get('period'):previousPeriod();
      const fmt=value=>value<1000?`${Math.max(0,value).toFixed(value<100?1:0)} m`:`${(value/1000).toFixed(2)} km`;
      const crownSvg='<svg viewBox="0 0 48 38" aria-hidden="true"><path class="crown-main outline" d="M5 10l10 8 9-13 9 13 10-8-4 21H9z"/><path class="crown-light" d="M11 13l5 4-3 10h6L24 8l-9 14z" opacity=".72"/><path class="crown-dark outline" d="M9 28h30v6H9z"/><circle class="crown-light outline" cx="5" cy="9" r="3"/><circle class="crown-light outline" cx="24" cy="4" r="3"/><circle class="crown-light outline" cx="43" cy="9" r="3"/></svg>';
      let rows=[];
      function reportText(){let [year,month]=period.split('-');return [`Car Studio ${year}년 ${Number(month)}월 TOP 10`,'',...rows.map((row,index)=>`${index+1}위  ${row.name} · ${fmt(Number(row.score)||0)} · ${row.car}`),'',location.href].join('\n')}
      function render(){let [year,month]=period.split('-');$('#title').textContent=`${Number(month)}월의 TOP 10`;$('#period').textContent=`${year}년 ${Number(month)}월 1일 ~ 월말 (KST)`;document.title=`Car Studio ${year}년 ${Number(month)}월 TOP 10`;let list=$('#ranking');list.replaceChildren();rows.forEach((row,index)=>{let item=document.createElement('li'),position=document.createElement('span'),name=document.createElement('span'),score=document.createElement('span');item.className='row';if(index<3){position.className=`crown ${index===0?'gold':index===1?'silver':'bronze'}`;position.innerHTML=crownSvg;position.setAttribute('aria-label',`${index+1}위 왕관`)}else{position.className='position';position.textContent=index+1}name.className='name';name.textContent=row.name;score.className='score';score.textContent=fmt(Number(row.score)||0);item.append(position,name,score);list.append(item)});$('#state').hidden=rows.length>0;$('#state').textContent=rows.length?'':'이 달에는 등록된 기록이 없습니다.';list.hidden=rows.length===0}
      $('#naverShare').onclick=()=>{let url=new URL('https://blog.naver.com/openapi/share');url.searchParams.set('url',location.href);url.searchParams.set('title',document.title);window.open(url,'naver-blog-share','width=720,height=760,noopener,noreferrer')};
      $('#copyReport').onclick=async()=>{try{await navigator.clipboard.writeText(reportText());$('#copyReport').textContent='복사했습니다!';setTimeout(()=>$('#copyReport').textContent='랭킹 내용 복사',1500)}catch(_){$('#copyReport').textContent='복사하지 못했습니다'}};
      fetch(`/api/rankings?period=${encodeURIComponent(period)}`,{cache:'no-store',headers:{Accept:'application/json'}}).then(response=>{if(!response.ok)throw new Error('ranking');return response.json()}).then(data=>{rows=Array.isArray(data.rankings)?data.rankings:[];render()}).catch(()=>{$('#state').textContent='랭킹을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'});
      render();
    })();
  </script>
</body>
</html>
