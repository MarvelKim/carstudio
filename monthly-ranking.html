<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Car Studio 멀리날리기 월간 TOP 10 랭킹">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Car Studio">
  <meta property="og:title" content="Car Studio 월간 TOP 10">
  <meta property="og:description" content="매월 1일부터 월말까지 집계한 멀리날리기 TOP 10 기록입니다.">
  <title>Car Studio 월간 TOP 10</title>
  <style>
    :root{--ink:#14213d;--paper:#fffdf5;--yellow:#ffd23f;--red:#ff4d4d;--blue:#2f80ed;--muted:#637083}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:linear-gradient(150deg,#8de3ff,#e8fbff 48%,#fff4cf);color:var(--ink);font-family:Inter,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}.card{width:min(820px,100%);margin:auto;padding:28px;border:4px solid var(--ink);border-radius:24px;background:var(--paper);box-shadow:9px 9px 0 var(--ink)}.badge{display:table;margin:auto;padding:7px 16px;border:2px solid var(--ink);border-radius:999px;background:var(--yellow);font-weight:1000}h1{margin:15px 0 5px;text-align:center;font-size:clamp(34px,8vw,62px);line-height:1}.period{margin:0 0 20px;color:var(--muted);font-weight:900;text-align:center}.state{padding:24px;color:var(--muted);font-weight:900;text-align:center}.ranking{display:grid;gap:8px;margin:0;padding:0;list-style:none}.row{display:grid;grid-template-columns:40px minmax(80px,.75fr) 82px minmax(120px,1fr) auto;align-items:center;gap:10px;min-height:58px;padding:6px 13px;border:2px solid #d8dde5;border-radius:12px;background:#fff;font-size:17px;font-weight:900}.position{display:grid;place-items:center;width:31px;height:31px;border-radius:50%;background:#edf0f5;font-size:16px}.name,.car-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.car-name{color:var(--muted);font-size:14px}.car-thumb{position:relative;display:grid;place-items:center;width:82px;height:46px;border-radius:9px;background:#f5f7fa;overflow:hidden}.car-thumb::before{content:'🚗';font-size:24px;opacity:.45}.car-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.score{color:var(--red);white-space:nowrap}.crown{--main:#ffd23f;--dark:#e6a800;--light:#fff1a6;display:grid;place-items:center;width:34px;height:34px}.crown.silver{--main:#d9e0e9;--dark:#8b98a9;--light:#fff}.crown.bronze{--main:#cd7f45;--dark:#8f4d2d;--light:#f1bc8e}.crown svg{width:32px;height:28px;filter:drop-shadow(0 1px 0 rgba(20,33,61,.3));overflow:visible}.crown-main{fill:var(--main)}.crown-dark{fill:var(--dark)}.crown-light{fill:var(--light)}.outline{stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.button{display:grid;place-items:center;min-height:48px;padding:9px 14px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);font-family:inherit;font-size:15px;font-weight:900;text-align:center;text-decoration:none;box-shadow:3px 3px 0 var(--ink);cursor:pointer}.button.primary{background:var(--yellow)}.button:disabled{cursor:wait;opacity:.55}.action-wide{grid-column:1/-1}.notice{margin:18px 0 0;color:var(--muted);font-size:12px;font-weight:800;line-height:1.55;text-align:center}@media(max-width:560px){body{padding:12px}.card{padding:20px 14px}.row{grid-template-columns:31px minmax(52px,.7fr) 50px minmax(68px,1fr) auto;gap:6px;padding:5px 7px;font-size:12px}.car-thumb{width:50px;height:30px;border-radius:6px}.car-name{font-size:10px}.actions{grid-template-columns:1fr}.action-wide{grid-column:auto}}
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">전체 사용자 랭킹</span>
    <h1 id="title">월간 TOP 10</h1>
    <p class="period" id="period"></p>
    <p class="state" id="state">랭킹을 불러오는 중...</p>
    <ol class="ranking" id="ranking" hidden></ol>
    <div class="actions">
      <button class="button primary action-wide" id="imageShare" type="button" disabled>랭킹 이미지 준비 중...</button>
      <button class="button" id="imageDownload" type="button" disabled>PNG 이미지 저장</button>
      <button class="button" id="naverShare" type="button">네이버 블로그 글쓰기</button>
      <button class="button" id="copyReport" type="button">랭킹 내용 복사</button>
      <a class="button" href="game.html">미니게임 하러 가기</a>
    </div>
    <p class="notice" id="shareNotice">개인정보 보호를 위해 다른 사용자의 이름은 일부 가려서 표시합니다. 모바일에서는 ‘랭킹 이미지 바로 공유’를 누르고 네이버 블로그 앱을 선택하세요. 지원하지 않는 환경에서는 PNG가 저장되고 네이버 글쓰기 화면이 열립니다.</p>
  </main>
  <script src="car-model-image.js"></script>
  <script>
    (()=>{
      const $=selector=>document.querySelector(selector);
      const validPeriod=value=>/^\d{4}-(0[1-9]|1[0-2])$/.test(value||'');
      const previousPeriod=()=>{let now=new Date(),kst=new Date(now.getTime()+9*60*60*1000),date=new Date(Date.UTC(kst.getUTCFullYear(),kst.getUTCMonth()-1,1));return `${date.getUTCFullYear()}-${String(date.getUTCMonth()+1).padStart(2,'0')}`};
      const period=validPeriod(new URLSearchParams(location.search).get('period'))?new URLSearchParams(location.search).get('period'):previousPeriod();
      const fmt=value=>value<1000?`${Math.max(0,value).toFixed(value<100?1:0)} m`:`${(value/1000).toFixed(2)} km`;
      const crownSvg='<svg viewBox="0 0 48 38" aria-hidden="true"><path class="crown-main outline" d="M5 10l10 8 9-13 9 13 10-8-4 21H9z"/><path class="crown-light" d="M11 13l5 4-3 10h6L24 8l-9 14z" opacity=".72"/><path class="crown-dark outline" d="M9 28h30v6H9z"/><circle class="crown-light outline" cx="5" cy="9" r="3"/><circle class="crown-light outline" cx="24" cy="4" r="3"/><circle class="crown-light outline" cx="43" cy="9" r="3"/></svg>';
      let rows=[],rankingImageFile=null;
      function reportText(){let [year,month]=period.split('-');return [`Car Studio ${year}년 ${Number(month)}월 TOP 10`,'',...rows.map((row,index)=>`${index+1}위  ${row.name} · ${fmt(Number(row.score)||0)} · ${row.car}`),'',location.href].join('\n')}
      function rounded(context,x,y,width,height,radius){let r=Math.min(radius,width/2,height/2);context.beginPath();context.moveTo(x+r,y);context.arcTo(x+width,y,x+width,y+height,r);context.arcTo(x+width,y+height,x,y+height,r);context.arcTo(x,y+height,x,y,r);context.arcTo(x,y,x+width,y,r);context.closePath()}
      function fittedText(context,value,maxWidth){let text=String(value||'');if(context.measureText(text).width<=maxWidth)return text;while(text.length>1&&context.measureText(`${text}…`).width>maxWidth)text=text.slice(0,-1);return `${text}…`}
      function createRankingImage(){
        if(!rows.length)return Promise.resolve(null);
        let canvas=document.createElement('canvas'),paint=canvas.getContext('2d'),width=1080,height=1350,[year,month]=period.split('-');canvas.width=width;canvas.height=height;
        let sky=paint.createLinearGradient(0,0,width,height);sky.addColorStop(0,'#8de3ff');sky.addColorStop(.52,'#e8fbff');sky.addColorStop(1,'#fff0bb');paint.fillStyle=sky;paint.fillRect(0,0,width,height);
        paint.fillStyle='rgba(255,255,255,.7)';[[120,155,76],[875,190,98],[930,470,58]].forEach(([x,y,r])=>{paint.beginPath();paint.arc(x,y,r*.55,0,Math.PI*2);paint.arc(x+r*.45,y-r*.18,r*.68,0,Math.PI*2);paint.arc(x+r,y,r*.48,0,Math.PI*2);paint.fill()});
        paint.textAlign='center';paint.fillStyle='#14213d';paint.font='1000 42px Inter,"Malgun Gothic",sans-serif';paint.fillText('CAR STUDIO · SKY LAUNCH',width/2,90);
        paint.fillStyle='#ffd23f';paint.strokeStyle='#14213d';paint.lineWidth=7;rounded(paint,337,126,406,72,36);paint.fill();paint.stroke();paint.fillStyle='#14213d';paint.font='1000 31px Inter,"Malgun Gothic",sans-serif';paint.fillText('전체 사용자 랭킹',width/2,173);
        paint.font='1000 72px Inter,"Malgun Gothic",sans-serif';paint.fillText(`${Number(month)}월의 TOP 10`,width/2,265);paint.fillStyle='#637083';paint.font='900 27px Inter,"Malgun Gothic",sans-serif';paint.fillText(`${year}년 ${Number(month)}월 1일 ~ 월말 (KST)`,width/2,310);
        paint.fillStyle='#fffdf5';paint.shadowColor='#14213d';paint.shadowOffsetX=10;paint.shadowOffsetY=10;rounded(paint,60,350,960,850,34);paint.fill();paint.shadowColor='transparent';paint.strokeStyle='#14213d';paint.lineWidth=7;paint.stroke();
        rows.slice(0,10).forEach((row,index)=>{let y=388+index*78,tone=index===0?'#ffd23f':index===1?'#d9e0e9':index===2?'#cd7f45':'#edf0f5';paint.fillStyle=index<3?'#fff9df':'#fff';rounded(paint,90,y,900,64,16);paint.fill();paint.strokeStyle='#d8dde5';paint.lineWidth=2;paint.stroke();paint.fillStyle=tone;paint.strokeStyle='#14213d';paint.lineWidth=3;paint.beginPath();paint.arc(132,y+32,22,0,Math.PI*2);paint.fill();paint.stroke();paint.fillStyle='#14213d';paint.textAlign='center';paint.font='1000 24px Inter,"Malgun Gothic",sans-serif';paint.fillText(String(index+1),132,y+40);paint.textAlign='left';paint.font='1000 27px Inter,"Malgun Gothic",sans-serif';paint.fillText(fittedText(paint,row.name,310),176,y+29);paint.fillStyle='#637083';paint.font='800 19px Inter,"Malgun Gothic",sans-serif';paint.fillText(fittedText(paint,row.car,360),176,y+53);paint.fillStyle='#ff4d4d';paint.textAlign='right';paint.font='1000 28px Inter,"Malgun Gothic",sans-serif';paint.fillText(fmt(Number(row.score)||0),950,y+42)});
        paint.textAlign='center';paint.fillStyle='#14213d';paint.font='900 25px Inter,"Malgun Gothic",sans-serif';paint.fillText('carstudio-dye.pages.dev',width/2,1272);paint.fillStyle='#637083';paint.font='800 19px Inter,"Malgun Gothic",sans-serif';paint.fillText('월말 기준 확정 랭킹 · 다른 사용자의 이름은 일부 가림 처리됩니다',width/2,1308);
        return new Promise(resolve=>canvas.toBlob(blob=>{if(!blob){resolve(null);return}let name=`carstudio-ranking-${period}.png`;if(typeof File==='function')resolve(new File([blob],name,{type:'image/png'}));else{blob.name=name;resolve(blob)}},'image/png'))
      }
      function downloadImage(file){let link=document.createElement('a'),url=URL.createObjectURL(file);link.href=url;link.download=file.name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
      function openNaverShare(){let url=new URL('https://blog.naver.com/openapi/share');url.searchParams.set('url',location.href);url.searchParams.set('title',document.title);window.open(url,'naver-blog-share','width=720,height=760,noopener,noreferrer')}
      async function prepareRankingImage(){rankingImageFile=await createRankingImage();$('#imageShare').disabled=!rankingImageFile;$('#imageDownload').disabled=!rankingImageFile;$('#imageShare').textContent=rankingImageFile?'랭킹 이미지 바로 공유':'공유할 랭킹 기록 없음'}
      async function shareRankingImage(){let file=rankingImageFile;if(!file)return;let data={title:document.title,text:reportText(),files:[file]};try{if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share(data);return}downloadImage(file);openNaverShare();navigator.clipboard?.writeText(reportText()).catch(()=>{});$('#shareNotice').textContent='PNG 이미지를 저장하고 네이버 블로그 화면을 열었습니다. 저장된 이미지를 글에 첨부해 주세요.'}catch(error){if(error?.name!=='AbortError'){downloadImage(file);$('#shareNotice').textContent='직접 공유를 지원하지 않아 PNG 이미지를 저장했습니다. 네이버 블로그에서 이미지를 첨부해 주세요.'}}}
      function render(){let [year,month]=period.split('-');$('#title').textContent=`${Number(month)}월의 TOP 10`;$('#period').textContent=`${year}년 ${Number(month)}월 1일 ~ 월말 (KST)`;document.title=`Car Studio ${year}년 ${Number(month)}월 TOP 10`;let list=$('#ranking');list.replaceChildren();rows.forEach((row,index)=>{let item=document.createElement('li'),position=document.createElement('span'),name=document.createElement('span'),carImage=document.createElement('span'),carName=document.createElement('span'),score=document.createElement('span');item.className='row';if(index<3){position.className=`crown ${index===0?'gold':index===1?'silver':'bronze'}`;position.innerHTML=crownSvg;position.setAttribute('aria-label',`${index+1}위 왕관`)}else{position.className='position';position.textContent=index+1}name.className='name';name.textContent=row.name;carImage.className='car-thumb';let imageUrl=window.carModelImageUrl(row.car);if(imageUrl){let image=document.createElement('img');image.src=imageUrl;image.alt='';image.loading='lazy';image.onerror=()=>image.remove();carImage.append(image)}carName.className='car-name';carName.textContent=row.car||'Mystery Car';score.className='score';score.textContent=fmt(Number(row.score)||0);item.append(position,name,carImage,carName,score);list.append(item)});$('#state').hidden=rows.length>0;$('#state').textContent=rows.length?'':'이 달에는 등록된 기록이 없습니다.';list.hidden=rows.length===0}
      $('#imageShare').onclick=shareRankingImage;
      $('#imageDownload').onclick=()=>rankingImageFile&&downloadImage(rankingImageFile);
      $('#naverShare').onclick=openNaverShare;
      $('#copyReport').onclick=async()=>{try{await navigator.clipboard.writeText(reportText());$('#copyReport').textContent='복사했습니다!';setTimeout(()=>$('#copyReport').textContent='랭킹 내용 복사',1500)}catch(_){$('#copyReport').textContent='복사하지 못했습니다'}};
      fetch(`/api/rankings?period=${encodeURIComponent(period)}`,{cache:'no-store',headers:{Accept:'application/json'}}).then(response=>{if(!response.ok)throw new Error('ranking');return response.json()}).then(data=>{rows=Array.isArray(data.rankings)?data.rankings:[];render();prepareRankingImage().catch(()=>{$('#imageShare').textContent='랭킹 이미지를 만들 수 없음'})}).catch(()=>{$('#state').textContent='랭킹을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';$('#imageShare').textContent='랭킹 이미지를 만들 수 없음'});
      render();
    })();
  </script>
</body>
</html>
